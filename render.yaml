services:
  - type: web
    name: arjuna-ai
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    domains:
      - gold-etechapp.com
    envVars:
      - key: APP_NAME
        value: ARJUNA AI
      - key: APP_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://gold-etechapp.com
      - key: CORS_ORIGINS
        value: https://gold-etechapp.com,https://www.gold-etechapp.com
      - key: MAX_REQUEST_BYTES
        value: "1048576"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "55"
      - key: PROVIDER_FAILURE_COOLDOWN_SECONDS
        value: "60"

      # ARJUNA gateway credential. Enter a long random value during Blueprint setup.
      - key: PLATFORM_API_KEYS
        sync: false

      # Configure at least one provider during Blueprint setup.
      - key: NVIDIA_ENABLED
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_PRIORITY
        value: "10"
      - key: NVIDIA_FREE_ELIGIBLE
        value: "true"

      - key: GEMINI_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMINI_PRIORITY
        value: "20"
      - key: GEMINI_FREE_ELIGIBLE
        value: "true"

      - key: GROQ_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_PRIORITY
        value: "30"
      - key: GROQ_FREE_ELIGIBLE
        value: "true"

      - key: OPENROUTER_ENABLED
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_PRIORITY
        value: "40"
      - key: OPENROUTER_FREE_ELIGIBLE
        value: "false"

      - key: OPENAI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_PRIORITY
        value: "50"
      - key: OPENAI_FREE_ELIGIBLE
        value: "false"
