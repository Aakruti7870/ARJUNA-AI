name: AI Provider Health Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-providers:
    runs-on: ubuntu-latest

    steps:
      - name: Check OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo "OPENAI=SECRET_MISSING"; exit 1; }
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY")
          if [ "$CODE" = "200" ]; then
            echo "OPENAI=CONNECTED"
          else
            echo "OPENAI=FAILED HTTP_$CODE"
            exit 1
          fi

      - name: Check NVIDIA
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY" || { echo "NVIDIA=SECRET_MISSING"; exit 1; }
          BASE_URL="${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$BASE_URL/models" \
            -H "Authorization: Bearer $NVIDIA_API_KEY")
          if [ "$CODE" = "200" ]; then
            echo "NVIDIA=CONNECTED"
          else
            echo "NVIDIA=FAILED HTTP_$CODE"
            exit 1
          fi

      - name: Check Amazon Bedrock
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          set -euo pipefail
          test -n "$AWS_BEARER_TOKEN_BEDROCK" || { echo "BEDROCK=SECRET_MISSING"; exit 1; }
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1/models" \
            -H "Authorization: Bearer $AWS_BEARER_TOKEN_BEDROCK")
          if [ "$CODE" = "200" ]; then
            echo "BEDROCK=CONNECTED"
          else
            echo "BEDROCK=FAILED HTTP_$CODE"
            exit 1
          fi
