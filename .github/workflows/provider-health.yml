name: AI Provider Health Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/provider-health.yml"

concurrency:
  group: ai-provider-health-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-providers:
    runs-on: ubuntu-latest

    steps:
      - name: Check OpenAI
        id: openai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -u
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI=SECRET_MISSING"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OPENAI_API_KEY")
          echo "OPENAI_HTTP=$CODE"
          test "$CODE" = "200"

      - name: Check NVIDIA
        id: nvidia
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL }}
        run: |
          set -u
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "NVIDIA=SECRET_MISSING"
            exit 1
          fi
          BASE_URL="${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$BASE_URL/models" \
            -H "Authorization: Bearer $NVIDIA_API_KEY")
          echo "NVIDIA_HTTP=$CODE"
          test "$CODE" = "200"

      - name: Check Amazon Bedrock
        id: bedrock
        continue-on-error: true
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          set -u
          if [ -z "${AWS_BEARER_TOKEN_BEDROCK:-}" ]; then
            echo "BEDROCK=SECRET_MISSING"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://bedrock-runtime.us-east-1.amazonaws.com/openai/v1/models" \
            -H "Authorization: Bearer $AWS_BEARER_TOKEN_BEDROCK")
          echo "BEDROCK_HTTP=$CODE"
          test "$CODE" = "200"

      - name: Provider health summary
        env:
          OPENAI_RESULT: ${{ steps.openai.outcome }}
          NVIDIA_RESULT: ${{ steps.nvidia.outcome }}
          BEDROCK_RESULT: ${{ steps.bedrock.outcome }}
        run: |
          echo "OpenAI: $OPENAI_RESULT"
          echo "NVIDIA: $NVIDIA_RESULT"
          echo "Bedrock: $BEDROCK_RESULT"
          if [ "$OPENAI_RESULT" != "success" ] || \
             [ "$NVIDIA_RESULT" != "success" ] || \
             [ "$BEDROCK_RESULT" != "success" ]; then
            exit 1
          fi
