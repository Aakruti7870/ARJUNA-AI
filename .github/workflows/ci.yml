name: ARJUNA AI CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: node --check static/workspace.js
      - run: node --check static/preview.js
      - run: node --check static/growth.js
      - run: node --check static/service-worker.js
      - name: Reject inline scripts in portal
        run: |
          if grep -n '<script>' static/index.html; then
            echo 'Inline scripts are blocked by the production CSP.'
            exit 1
          fi
      - run: docker build -t arjuna-ai-ci .
